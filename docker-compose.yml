services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"

  metrics-service:
    build: .
    command: ["uvicorn", "src.metrics_service:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 60s
      retries: 30
      start_period: 60s
    ports:
      - "8001:8001"

  response-service:
    build: .
    command: ["uvicorn", "src.response_service:app", "--host", "0.0.0.0", "--port", "8002", "--no-access-log"]
    environment:
      - PYTHONPATH=/app
    volumes:
      - dataset:/app/dataset
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 60s
      retries: 60
      start_period: 60s
    ports:
      - "8002:8002"

  cache-service:
    build: .
    command: ["uvicorn", "src.cache_service:app", "--host", "0.0.0.0", "--port", "8000", "--log-level", "warning", "--no-access-log"]
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - RESPONSE_SERVICE_URL=http://response-service:8002
      - METRICS_SERVICE_URL=http://metrics-service:8001
      - CACHE_TTL=120
    depends_on:
      redis:
        condition: service_started
      response-service:
        condition: service_healthy
      metrics-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 60s
      retries: 30
      start_period: 60s
    ports:
      - "8000:8000"

  traffic-generator:
    build: .
    command: ["python", "-m", "src.traffic_generator", "--base-url", "http://cache-service:8000", "--metrics-url", "http://metrics-service:8001/summary", "--requests", "500", "--distribution", "zipf"]
    environment:
      - PYTHONPATH=/app
    depends_on:
      cache-service:
        condition: service_healthy

volumes:
  dataset:
